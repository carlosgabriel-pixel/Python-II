{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <h2>Criar nova conta</h2>
    <form action="{{ url_for('cadastro') }}" method="POST">
        <div class="form-group">
            <label for="username">Nome de Usuário</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="foto">URL da Foto de Perfil</label>
            <input type="url" id="foto" name="foto" placeholder="https://exemplo.com/foto.jpg">
        </div>
        <div class="form-group">
            <label for="bio">Biografia / Descrição</label>
            <textarea id="bio" name="bio" rows="3" placeholder="Fale um pouco sobre você..."></textarea>
        </div>
        <div class="form-group checkbox">
            <label><input type="checkbox" name="remember"> Lembrar de mim</label>
        </div>
        <button type="submit" class="btn">Cadastrar</button>
    </form>
</div>
{% endblock %}
