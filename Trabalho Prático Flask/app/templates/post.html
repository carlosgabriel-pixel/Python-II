{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <h2>Criar Novo Post</h2>
    <form action="{{ url_for('post') }}" method="POST">
        <div class="form-group">
            <label for="body">Mensagem</label>
            <textarea id="body" name="body" rows="4" placeholder="O que está acontecendo?" required></textarea>
        </div>
        <button type="submit" class="btn">Publicar</button>
    </form>
</div>
{% endblock %}
